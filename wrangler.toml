# Cloudflare Worker — static site plus the submission API.
#
#   npx wrangler login
#   npx wrangler deploy
#
# The custom domain is ON; the storage bindings are OFF, waiting on resources
# that do not exist yet. `node scripts/setup-cloudflare.mjs` creates them and
# switches the bindings on in one go. See README.md.
name = "inthinks"
compatibility_date = "2026-08-18"
main = "worker/index.ts"

# dist/ is generated and git-ignored, so `wrangler deploy` builds it first.
#
# The install is conditional on purpose, and the condition matters twice over.
# Cloudflare runs the deploy command directly against a fresh clone, and some
# runners install with NODE_ENV=production, which drops devDependencies and so
# removes vite and tsc — hence `--include=dev` when the build tools are absent.
# But `npm ci` deletes node_modules wholesale, which would pull the rug from
# under a running `wrangler dev` (miniflare lives there too). Checking for the
# vite binary first means a local machine never reinstalls, and a bare runner
# always does.
[build]
command = "test -x node_modules/.bin/vite || npm ci --include=dev && npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# The site is a client-routed SPA; serve index.html for any unmatched path so
# deep links and refreshes resolve.
not_found_handling = "single-page-application"
# Without this, the SPA fallback would answer /api/* with index.html before the
# Worker ever saw the request.
run_worker_first = ["/api/*"]

# ─────────────────────────────────────────────────────────────────────────
# Storage bindings — OFF, deliberately, and this is not the finished state.
#
# A binding naming a resource that does not exist fails the whole deploy. With
# these switched on and no database created, every build failed — which froze
# the live site on an old version and took the whole design with it, not just
# the feature that was waiting. The site now deploys again; submissions stay
# off until the resources exist.
#
# The Worker is built for this: with no bindings, /api/status reports false and
# the forms say submissions are not configured rather than pretending to accept
# them. Nothing is broken, it is switched off.
#
# To switch it on, one command:
#
#   npx wrangler login
#   node scripts/setup-cloudflare.mjs
#
# That creates the database and the bucket, writes the real id in below,
# uncomments both blocks, and applies the migrations. Commit what it changes.
# ─────────────────────────────────────────────────────────────────────────

# [[d1_databases]]
# binding = "DB"
# database_name = "inthinks-submissions"
# database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
# migrations_dir = "migrations"

# [[r2_buckets]]
# binding = "EVIDENCE"
# bucket_name = "inthinks-evidence"

# Custom domain — ON. inthinks.com must be a zone on this Cloudflare account
# before this deploys; a route the account does not own fails the deploy the
# same way a missing binding does.
#
# `custom_domain = true` makes Cloudflare create and manage the DNS record and
# the certificate for that hostname.
#
# A Custom Domain is an exact hostname match: a Worker attached to the apex
# does not receive www, and vice versa. That is why www.inthinks.com returned
# NXDOMAIN while the apex worked — nothing was claiming the name, so no record
# was ever created for it. It needs its own entry, and this is enough; on
# deploy Cloudflare creates the record and issues the certificate. No dashboard
# and no API token.
#
# Both hostnames then serve the same site, and a canonical link in index.html
# names the apex as the real address so search engines do not treat them as two
# sites. A 301 would be tidier still — scripts/setup-www-redirect.mjs adds one
# — but that needs an API token and this does not.
#
# Comment these out to deploy to the workers.dev subdomain instead.
[[routes]]
pattern = "inthinks.com"
custom_domain = true

[[routes]]
pattern = "www.inthinks.com"
custom_domain = true

# Outbox retry: re-sends submitter receipts and team notices that the
# submitting request could not deliver. Free on the Workers Free plan.
[triggers]
crons = ["*/5 * * * *"]
