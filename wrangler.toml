# Cloudflare Worker — static site plus the submission API.
#
#   npx wrangler login
#   npx wrangler deploy
#
# The storage bindings and the custom domain below are ON, so this config needs
# a D1 database, an R2 bucket and the inthinks.com zone to exist on the account
# before it will deploy at all — and the database_id is still a placeholder.
# See the blocks below, and README.md.
name = "inthinks"
compatibility_date = "2026-08-18"
main = "worker/index.ts"

# dist/ is generated and git-ignored, so `wrangler deploy` builds it first.
#
# The install is conditional on purpose, and the condition matters twice over.
# Cloudflare runs the deploy command directly against a fresh clone, and some
# runners install with NODE_ENV=production, which drops devDependencies and so
# removes vite and tsc — hence `--include=dev` when the build tools are absent.
# But `npm ci` deletes node_modules wholesale, which would pull the rug from
# under a running `wrangler dev` (miniflare lives there too). Checking for the
# vite binary first means a local machine never reinstalls, and a bare runner
# always does.
[build]
command = "test -x node_modules/.bin/vite || npm ci --include=dev && npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# The site is a client-routed SPA; serve index.html for any unmatched path so
# deep links and refreshes resolve.
not_found_handling = "single-page-application"
# Without this, the SPA fallback would answer /api/* with index.html before the
# Worker ever saw the request.
run_worker_first = ["/api/*"]

# ─────────────────────────────────────────────────────────────────────────
# Storage bindings — ON.
#
# THIS CONFIG DOES NOT DEPLOY UNTIL BOTH RESOURCES EXIST ON THE ACCOUNT.
# A binding naming a resource that is not there fails the whole deploy, and
# `database_id` below is still a placeholder. Three steps, once:
#
#   1. npx wrangler d1 create inthinks-submissions
#      Replace the placeholder database_id with the id it prints.
#
#   2. Cloudflare dashboard → R2 → Enable (free tier is enough), then:
#      npx wrangler r2 bucket create inthinks-evidence
#
#   3. npx wrangler d1 migrations apply inthinks-submissions --remote
#      Applies migrations/0001 through 0008. Without this the tables the
#      Worker queries do not exist and every /api call 500s.
#
# Then the secrets the platform needs:
#   npx wrangler secret put SESSION_SECRET       # required for admin sign-in
#   npx wrangler secret put IP_SALT              # required for rate limiting
#   npx wrangler secret put ANTHROPIC_API_KEY    # optional; matching 503s without it
#
# To go back to a deploy that works on a bare account, comment both blocks out
# again: the Worker handles their absence deliberately — /api/status reports
# false and the forms say submissions are not configured rather than
# pretending to accept them.
# ─────────────────────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DB"
database_name = "inthinks-submissions"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "inthinks-evidence"

# Custom domain — ON. inthinks.com must be a zone on this Cloudflare account
# before this deploys; a route the account does not own fails the deploy the
# same way a missing binding does.
#
# `custom_domain = true` makes Cloudflare create and manage the DNS record and
# the certificate for the apex. It covers the apex only.
#
# www is handled by a redirect rule, not by a route here: page requests are
# served from the asset layer without invoking the Worker (see run_worker_first
# above), so a redirect written in the Worker would never run for them. Set it
# up once with:
#
#   CLOUDFLARE_API_TOKEN=... node scripts/setup-www-redirect.mjs --dry-run
#   CLOUDFLARE_API_TOKEN=... node scripts/setup-www-redirect.mjs
#
# Comment this block out again to deploy to the workers.dev subdomain instead.
[[routes]]
pattern = "inthinks.com"
custom_domain = true
