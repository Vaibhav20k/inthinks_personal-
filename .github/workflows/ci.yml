# Type checks, unit suites, the HTTP integration suite (isolated Miniflare
# D1/R2, mocked email/webhook), the production build and CSP hashing.
# No secrets are used and nothing is deployed.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    # Conventional Commits: type(scope)!: subject. Checks only the commits this
    # push or pull request adds; merge commits are skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch: nothing to compare against."; exit 0
          fi
          pattern='(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,._/-]+\))?!?: .+'
          bad=$(git log --no-merges --format='%h %s' "$BEFORE..$AFTER" | grep -Ev "^[0-9a-f]+ $pattern" || true)
          if [ -n "$bad" ]; then
            echo "These commits do not follow Conventional Commits (type(scope): subject):"
            echo "$bad"; exit 1
          fi
          echo "All commit messages follow Conventional Commits."

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - name: Check every migration is append-only
        # Applied migrations must never be edited; a changed file means the
        # live database and the repository disagree.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}" -- migrations/ || true)
          if [ -n "$changed" ]; then echo "Edited or removed migrations: $changed"; exit 1; fi
