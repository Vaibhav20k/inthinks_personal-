<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InThinks — Where emerging innovation meets industrial demand.</title>
    <meta
      name="description"
      content="InThinks identifies promising early-stage technologies, develops selected innovations through focused R&D, and connects qualified solutions with real industrial challenges. Technology transfer, licensing and co-development."
    />
    <!-- Kept in step with the ground by the script below. It tints the
         browser's own bar on a phone, so a hardcoded white one would leave a
         white strip above a black page every night. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://inthinks.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InThinks" />
    <meta property="og:title" content="InThinks — Early innovation. Industry ready." />
    <meta
      property="og:description"
      content="An innovation intelligence and technology-transfer platform. Early-stage technologies developed toward industrial readiness, then transferred to industry."
    />
    <meta property="og:url" content="https://inthinks.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-hosted. The display face is preloaded because the hero paints
         first and carries the whole typographic identity. -->
    <link
      rel="preload"
      href="/fonts/archivo-variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      One canonical address.

      The site answers on both inthinks.com and www.inthinks.com, because a
      Custom Domain matches one exact hostname and www needs its own. Identical
      content on two hostnames is two sites as far as a search engine is
      concerned, so this names the apex as the real one. Set from the current
      path rather than hardcoded, and kept in step on navigation, so a deep
      link canonicalises to itself and not to the homepage.
    -->
    <link rel="canonical" href="https://inthinks.com/" />

    <!--
      Ground selection, before first paint.

      Inline and synchronous on purpose: if this ran after hydration the page
      would paint light and then flip, which is worse than either ground on
      its own. It is the one script that has to block.

      The order is deliberate:

        1. A ground the visitor pinned here wins, always. Pinning is a
           deliberate act — the header control has three positions and the
           middle two are the pins — so it is not something anyone lands on
           by accident, and AUTO is one click away from either of them.
           Nothing else pins a ground: absent a pin, everyone loads on AUTO.
        2. Otherwise, a system set to dark wins. That is an explicit signal
           from the person, and a clock should not overrule it at 2pm.
        3. Otherwise — and this is the common case, because most people never
           change the system default off light — the sun decides. Sunrise and
           sunset for the visitor's own location, falling back to 06:00–18:00
           until the first answer is cached.

      The clock is the visitor's, not the server's: this site says INDIA /
      GLOBAL, and a reader in Toronto should get their own evening.

      What "automatic" means is defined once, here, and handed to the app on
      `window.__inthinksGround`. The header control has to answer the same
      question this script does, and a second copy of the rule in the bundle
      would drift from this one the first time either was edited.
    -->
    <script>
      (function () {
        /**
         * Is it light out?
         *
         * Read from a sunrise and sunset cached by an earlier visit — no
         * network, so no flash. The times come from /api/daylight, which
         * computes them from the edge's coarse location; this script only
         * compares against them.
         *
         * With nothing cached, 06:00–18:00 local. That is wrong at the edges
         * of the year and the map, which is the whole reason the real answer
         * exists — but it is close enough for one page view, and it is the
         * only option that does not paint the wrong ground and flip.
         */
        function daylightGround() {
          var LIGHT_FROM = 6, DARK_FROM = 18
          try {
            var raw = localStorage.getItem('inthinks-daylight')
            if (raw) {
              var d = JSON.parse(raw)
              if (d.kind === 'polar-day') return 'light'
              if (d.kind === 'polar-night') return 'dark'
              if (typeof d.sunriseUtcMin === 'number' && typeof d.sunsetUtcMin === 'number') {
                var now = new Date()
                var m = now.getUTCHours() * 60 + now.getUTCMinutes()
                var rise = d.sunriseUtcMin, set = d.sunsetUtcMin
                var light = rise <= set ? (m >= rise && m < set) : (m >= rise || m < set)
                return light ? 'light' : 'dark'
              }
            }
          } catch (e) { /* unreadable cache: fall through to the hours */ }
          var h = new Date().getHours()
          return h >= LIGHT_FROM && h < DARK_FROM ? 'light' : 'dark'
        }

        /** What AUTO resolves to at this moment: the system, then the sun. */
        function autoGround() {
          if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) return 'dark'
          return daylightGround()
        }

        /**
         * Which of the three positions the control is in.
         *
         * The key is versioned, and the previous one is dropped on sight. The
         * control it belonged to had two positions and no way back, so a
         * stored value there did not mean "hold this ground" — most of them
         * were someone finding out what the button did, and then being served
         * that ground forever. Those are discarded once so everybody starts
         * where they should: on AUTO, following their own sunset. A value
         * written by the three-position control is a real choice and stays.
         */
        function savedMode() {
          try {
            localStorage.removeItem('inthinks-ground')
            var v = localStorage.getItem('inthinks-ground-v2')
            return v === 'light' || v === 'dark' ? v : 'auto'
          } catch (e) { return 'auto' }
        }

        /** Paints a ground. Shared, so the toggle cannot paint it differently. */
        function applyGround(ground) {
          if (ground === 'dark') document.documentElement.setAttribute('data-ground', 'dark')
          else document.documentElement.removeAttribute('data-ground')
          var bar = document.querySelector('meta[name="theme-color"]')
          if (bar) bar.setAttribute('content', ground === 'dark' ? '#050505' : '#ffffff')
        }

        window.__inthinksGround = { auto: autoGround, mode: savedMode, apply: applyGround }

        try {
          var mode = savedMode()
          applyGround(mode === 'auto' ? autoGround() : mode)

          var canonical = document.querySelector('link[rel="canonical"]')
          if (canonical) canonical.setAttribute('href', 'https://inthinks.com' + location.pathname)
        } catch (e) {
          /* Storage blocked or clock unreadable: fall through to the light
             ground, which is what the stylesheet gives with no attribute. */
        }
      })()

      /* Refresh the cached sunrise after the page has painted. Not awaited and
         never applied here: correcting the ground mid-paint is a flash with
         extra steps. The control's own AUTO watcher picks the new times up on
         its next tick, so a first visit at the edges of the map corrects
         itself within the minute rather than staying wrong all session. */
      addEventListener('load', function () {
        try {
          if (localStorage.getItem('inthinks-ground-v2')) return
          fetch('/api/daylight', { headers: { accept: 'application/json' } })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (d) {
              if (d && d.known) localStorage.setItem('inthinks-daylight', JSON.stringify(d))
            })
            .catch(function () { /* offline or blocked: the hours still work */ })
        } catch (e) { /* storage blocked */ }
      })
    </script>

    <!--
      Structured data.

      The office address is on the page for a reader; this is the same address
      for everything that is not one — the panel a search engine shows beside
      the name, a phone offering to add the contact, an aggregator resolving
      which InThinks this is. It is a data block, not a program: the browser
      never executes it, and the build's hasher covers it under the CSP along
      with the ground script.

      Both offices, primary first — `address` takes a list, and an
      organisation with two addresses that publishes one is findable at one.

      Kept in step with src/data/site.ts by hand, which is the one duplication
      here — a static file cannot import the module. Change one, change both.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "InThinks",
        "url": "https://inthinks.com/",
        "email": "hello@inthinks.com",
        "description": "An innovation intelligence and technology-transfer platform. Early-stage technologies developed toward industrial readiness, then transferred to industry.",
        "address": [
          {
            "@type": "PostalAddress",
            "streetAddress": "237, 1st Floor, Gujranwala Town, Part-3",
            "addressLocality": "New Delhi",
            "postalCode": "110009",
            "addressCountry": "IN"
          },
          {
            "@type": "PostalAddress",
            "streetAddress": "352, MG Road, Sultanpur",
            "addressLocality": "New Delhi",
            "postalCode": "110030",
            "addressCountry": "IN"
          }
        ]
      }
    </script>

    <!-- ?v= is a cache buster. Browsers cache favicons far more stubbornly
         than ordinary assets — Chrome keeps them in a separate store that a
         normal reload does not touch — so an edited icon can keep showing the
         old one for days. Bump the number whenever favicon.svg changes. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="mask-icon" href="/favicon.svg?v=2" color="#3b7baf" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
