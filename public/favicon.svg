<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The InThinks mark, traced from public/InThinks.png: an eight-tooth gear
    inside a bulb. Vector rather than the PNG because the PNG is RGB with no
    alpha channel, so it carries a baked-in white background — which is the
    white tile that was showing in the tab.

    No background plate here. The base lightens under a dark colour scheme,
    since near-black disappears against a dark tab strip once nothing is
    holding it up. SVG favicons honour the media query.
  -->
  <style>
    .base { fill: #0a0a0f; opacity: 0.72; }
    @media (prefers-color-scheme: dark) {
      .base { fill: #e8e8ef; opacity: 0.85; }
    }
  </style>

