<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    No background plate: the mark sits directly on whatever the browser puts
    behind it, so the tab shows the logo rather than a white tile.

    That means the base of the bulb has to adapt. At favicon size it is drawn in
    near-black, which disappears against a dark tab strip, so it lightens under
    a dark colour scheme. The indigo reads on both and is left alone.
  -->
  <style>
    .base { fill: #0a0a0f; opacity: 0.75; }
    @media (prefers-color-scheme: dark) {
      .base { fill: #e8e8ef; opacity: 0.85; }
    }
  </style>
  <g fill="none" stroke="#1560bd" stroke-width="3.4" stroke-linejoin="round">
    <path d="M32 7c-10 0-17.6 7.6-17.6 17.2 0 5.7 2.6 9.9 5.9 13.2 1.9 2 2.9 3.8 2.9 6.3v2.1h17.6v-2.1c0-2.5 1-4.3 2.9-6.3 3.3-3.3 5.9-7.5 5.9-13.2C49.6 14.6 42 7 32 7Z"/>
    <circle cx="32" cy="24.2" r="6.2"/>
  </g>
  <g stroke="#1560bd" stroke-width="3.4" stroke-linecap="round">
    <path d="M32 14.6v-3M32 33.8v3M23.4 24.2h-3M43.6 24.2h3M25.9 18.1l-2.1-2.1M38.1 30.3l2.1 2.1M38.1 18.1l2.1-2.1M25.9 30.3l-2.1 2.1"/>
  </g>
  <g class="base">
    <rect x="23" y="48" width="18" height="3.2" rx="1"/>
    <rect x="23" y="52.6" width="18" height="3.2" rx="1"/>
    <path d="M26 57.2h12l-2.3 3.8a2 2 0 0 1-1.7 1h-4a2 2 0 0 1-1.7-1L26 57.2Z"/>
  </g>
</svg>
